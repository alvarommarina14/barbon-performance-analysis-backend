spring:
  application:
    name: court-proof-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/courtproof}
    username: ${DATABASE_USER:courtproof}
    password: ${DATABASE_PASSWORD:courtproof}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Video bytes never reach the backend; this only guards PDFs and images.
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.barbonperformance.courtproof: DEBUG

courtproof:
  security:
    # Development key only. Every deployment supplies its own through the environment.
    jwt-secret: ${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
    # Short: a stolen access token cannot be revoked, only outlived.
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    organization-slug: barbon-performance
