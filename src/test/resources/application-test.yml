spring:
  jpa:
    show-sql: false

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN

courtproof:
  video:
    # api-base-url is pointed at WireMock by AbstractIntegrationTest.
    account-id: test-account
    api-token: test-token
    webhook-secret: test-webhook-secret
    playback-token-ttl: 2h
    webhook-tolerance: 5m
    max-duration-seconds: 600
