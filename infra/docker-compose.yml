# Local development infrastructure for Barbon Performance Analysis.
#
# Cloudflare Stream has no emulator, so video development runs against a real Cloudflare
# development account with short test clips. Everything else runs here.
#
#   docker compose -f infra/docker-compose.yml up -d

name: barbon-performance-analysis

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bpa
      POSTGRES_USER: bpa
      POSTGRES_PASSWORD: bpa
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpa -d bpa']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Cloudflare R2, which is S3-compatible. PDFs, images and audio only —
  # video goes straight to Cloudflare Stream and never touches object storage here.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bpa
      MINIO_ROOT_PASSWORD: bpa-development
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket on first boot so the backend does not have to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bpa bpa-development &&
      mc mb --ignore-existing local/barbon-performance-analysis &&
      mc anonymous set none local/barbon-performance-analysis
      "

  # Catches transactional email (analysis published, password reset) without sending it.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  minio-data:
