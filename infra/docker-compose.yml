# Local development infrastructure for Barbon Performance Analysis.
#
# With ANALYSIS_VIDEO_PROVIDER=local the backend uses the tusd + MinIO services below instead
# of Cloudflare Stream: tusd owns the resumable upload and drops the finished file into MinIO,
# and the backend serves playback as a pre-signed MinIO URL. Production still uses Cloudflare.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# For an end-to-end run with a real phone, copy infra/.env.example to infra/.env and set the
# LAN address there so the upload and playback URLs the backend hands out are reachable.

name: barbon-performance-analysis

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bpa
      POSTGRES_USER: bpa
      POSTGRES_PASSWORD: bpa
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpa -d bpa']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Cloudflare R2, which is S3-compatible. Holds PDFs, images and audio, and —
  # when the local video provider is active — the uploaded videos that tusd writes here.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bpa
      MINIO_ROOT_PASSWORD: bpa-development
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket on first boot so the backend does not have to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bpa bpa-development &&
      mc mb --ignore-existing local/barbon-performance-analysis &&
      mc anonymous set none local/barbon-performance-analysis
      "

  # Resumable (tus) upload endpoint for the local video provider. Stores finished uploads in
  # the MinIO bucket and calls the backend's post-finish hook so the asset is marked READY.
  # -behind-proxy makes tusd honour the X-Forwarded-* headers the backend sends, so the upload
  # URL it advertises points at ANALYSIS_VIDEO_PUBLIC_URL (the LAN address), not the container.
  tusd:
    image: tusproject/tusd:v2.6.0
    command:
      - -behind-proxy
      # host.docker.internal is the machine running the backend. If the container gets
      # "connection refused" here, the backend is not on :8080 or is not on the local profile;
      # override the whole URL with TUSD_HOOK_URL (e.g. the machine's LAN address).
      - -hooks-http=${TUSD_HOOK_URL:-http://host.docker.internal:8080/api/v1/webhooks/tusd}?token=${TUSD_HOOK_SECRET:-local-hook-secret}
      - -hooks-enabled-events=post-finish
      - -s3-bucket=barbon-performance-analysis
      - -s3-endpoint=http://minio:9000
    environment:
      AWS_ACCESS_KEY_ID: bpa
      AWS_SECRET_ACCESS_KEY: bpa-development
      AWS_REGION: us-east-1
    ports:
      - '1080:8080'
    depends_on:
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Catches transactional email (analysis published, password reset) without sending it.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  minio-data:
